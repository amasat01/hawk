# Packaging of the simt wing of aether (the package aether.wings.simt) as its own distribution. The wing's folder holds only the
# package; this folder holds only the packaging, so a build leaves nothing inside the wing.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-simt"
version = "0.0.0"
description = "The SIMT source texts of the family"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = ["raptor-core", "aether-base", "raptor-simt"]

[project.entry-points."aether.wings"]
simt = "aether.wings.simt"

[tool.setuptools]
packages = ["aether.wings.simt"]

[tool.setuptools.package-dir]
"aether.wings.simt" = "../../aether/wings/simt"

[tool.setuptools.package-data]
"aether.wings.simt" = ["wing.json"]
