# Packaging of the cpu wing of aether (the package aether.wings.cpu) as its own distribution. The wing's folder holds only the
# package; this folder holds only the packaging, so a build leaves nothing inside the wing.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-cpu"
version = "0.0.0"
description = "The host source texts and the host vector verdict"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = ["raptor-core"]

[project.entry-points."raptor.components"]
aether_cpu = "aether.wings.cpu"

[tool.setuptools]
packages = ["aether.wings.cpu"]

[tool.setuptools.package-dir]
"aether.wings.cpu" = "../../aether/wings/cpu"

[tool.setuptools.package-data]
"aether.wings.cpu" = ["component.json"]
