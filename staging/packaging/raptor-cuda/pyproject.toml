# Packaging of the cuda wing of raptor (the package raptor.wings.cuda) as its own distribution. The wing's folder holds only the
# package; this folder holds only the packaging, so a build leaves nothing inside the wing.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "raptor-cuda"
version = "0.0.0"
description = "The CUDA facts wing of the family"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = ["raptor-core", "raptor-simt"]

[project.entry-points."raptor.wings"]
cuda = "raptor.wings.cuda"

[tool.setuptools]
packages = ["raptor.wings.cuda"]

[tool.setuptools.package-dir]
"raptor.wings.cuda" = "../../raptor/wings/cuda"

[tool.setuptools.package-data]
"raptor.wings.cuda" = ["wing.json", "facts.py", "raptor_facts.h", "cards.py"]
