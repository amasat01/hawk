# Packaging of the x86 wing of raptor (the package raptor.wings.x86) as its own distribution. The wing's folder holds only the
# package; this folder holds only the packaging, so a build leaves nothing inside the wing.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "raptor-x86"
version = "0.0.0"
description = "The x86 facts wing of the family"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = ["raptor-core", "raptor-cpu"]

[project.entry-points."raptor.wings"]
x86 = "raptor.wings.x86"

[tool.setuptools]
packages = ["raptor.wings.x86"]

[tool.setuptools.package-dir]
"raptor.wings.x86" = "../../raptor/wings/x86"

[tool.setuptools.package-data]
"raptor.wings.x86" = ["wing.json", "facts.py", "raptor_facts.h"]
