# The first-party variants: the numbers a backend's lowering and writers read, as data. ONE distribution; the package
# ``raptor_variants`` has one sub-package per variant (the folders beside this file), each declared as its own entry point of the
# group ``raptor.variants``. A third party ships its own distribution that declares one more entry point of that group.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "raptor-variants"
version = "0.0.0"
description = "The first-party variants of the raptor family: per-target numbers as data, with the generated C++ header of each"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }

[project.entry-points."raptor.variants"]
arm = "raptor_variants.arm"
cpu = "raptor_variants.cpu"
cuda = "raptor_variants.cuda"
simt = "raptor_variants.simt"
x86 = "raptor_variants.x86"

[tool.setuptools]
packages = ["raptor_variants", "raptor_variants.arm", "raptor_variants.cpu", "raptor_variants.cuda", "raptor_variants.simt", "raptor_variants.x86"]

[tool.setuptools.package-dir]
raptor_variants = "."
"raptor_variants.arm" = "arm"
"raptor_variants.cpu" = "cpu"
"raptor_variants.cuda" = "cuda"
"raptor_variants.simt" = "simt"
"raptor_variants.x86" = "x86"

[tool.setuptools.package-data]
"raptor_variants.arm" = ["raptor_variant.h"]
"raptor_variants.cpu" = ["raptor_variant.h"]
"raptor_variants.cuda" = ["raptor_variant.h"]
"raptor_variants.simt" = ["raptor_variant.h"]
"raptor_variants.x86" = ["raptor_variant.h"]
