#
# Publish raptor-hawk to PyPI through a Trusted Publisher (PyPI pending
# publisher: owner amasat01, GitHub environment "pypi"). No tokens, no
# secrets: the `publish` job authenticates with the environment's OIDC
# token (`permissions: id-token: write`).
#
# Nothing is built here. release.yml built, checked and tested the wheels on
# the pull request and stored them under the git tree hash; this workflow
# fetches that artifact for the tagged tree, verifies its checksums and
# uploads it. Pushing a tag `v*` publishes. `workflow_dispatch` runs the
# same fetch and verification but never uploads (a dry run).

name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the artifact built for this tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/ci_fetch_artifact.sh dist "$(git rev-parse 'HEAD^{tree}')" dist
      - name: Verify checksums
        run: cd dist && sha256sum -c SHA256SUMS
      - name: tag == version guard (every wheel and the sdist must agree)
        if: github.ref_type == 'tag'
        run: |
          want="${GITHUB_REF_NAME#v}"
          [ "${GITHUB_REF_NAME}" != "${want}" ] || { echo "::error::tag ${GITHUB_REF_NAME} does not start with 'v'"; exit 1; }
          for f in dist/*.whl; do
            version=$(basename "$f" | cut -d- -f2)
            [ "$version" = "$want" ] || { echo "::error::tag ${GITHUB_REF_NAME} != $(basename "$f") version ${version}"; exit 1; }
          done
          for f in dist/*.tar.gz; do
            version=$(basename "$f" .tar.gz | sed 's/^.*-//')
            [ "$version" = "$want" ] || { echo "::error::tag ${GITHUB_REF_NAME} != $(basename "$f") version ${version}"; exit 1; }
          done
          echo "OK: tag ${GITHUB_REF_NAME} == package version ${want}"
      - run: rm dist/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: raptor-hawk-dist
          retention-days: 7
          path: dist/

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: fetch
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/raptor-hawk
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: raptor-hawk-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist/
