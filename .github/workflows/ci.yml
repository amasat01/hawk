#
# ── CUDA toolchain caveat — READ BEFORE trusting a green run ────────────────
# tests/conftest.py's `built` session fixture (used by ~half the test files)
# builds every fixture kernel for BOTH the "host" and "cuda" targets
# (`BOTH = ("cuda", "host")`); tests/_toolchain.py is explicit that a missing
# nvcc FAILS rather than skips ("a skipped compile row certifies nothing"),
# and there is no gpu/cuda pytest marker to deselect with. Rather than accept
# that as permanently red, this job provisions a COMPILE-ONLY CUDA toolchain
# (nvcc AOT `-c`, never executed — no GPU or driver involved) via NVIDIA's
# apt repo for Ubuntu 24.04. This was authored and YAML-validated offline;
# it was NOT run anywhere, so the exact package set/versions below are
# unverified against a live runner.

name: CI

# Pull requests only: main receives the tested tree, nothing re-runs there.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    # The release label, the diff, the PR body and the tag it would create agree (tools/release_gate.sh). Skipped on other PRs.
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash tools/release_gate.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
  docs-fresh:
    # Freshness check, never a commit: the generator re-renders the pages and fails on any difference.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: hawk
      # companion eagle: the ref pinned in .github/companions, else a same-named branch, else main
      - uses: ./hawk/.github/actions/companion
        with:
          repo: eagle
          path: eagle
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}
          pins: hawk/.github/companions
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # companion site (amasat01.github.io): the ref pinned in .github/companions, else a same-named branch, else main
      - uses: ./hawk/.github/actions/companion
        with:
          repo: amasat01.github.io
          path: site
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}
          pins: hawk/.github/companions
      - name: ruff, the manifesto copy, and the documented numbers and capability map against the committed cards
        run: make -C hawk gate-lint SITE_SRC="$GITHUB_WORKSPACE/site" EAGLE_SRC="$GITHUB_WORKSPACE/eagle"
  test:
    needs: docs-fresh
    runs-on: ubuntu-24.04
    env:
      CC: gcc-13
      CXX: g++-13
      HAWK_CXX: g++-13
      # tests/_toolchain.py's device_compiler(): $HAWK_NVCC first, else the
      # hardcoded /usr/local/cuda-12.9/bin/nvcc, else bare `nvcc` on PATH.
      # Set explicitly so it does not depend on PATH ordering.
      HAWK_NVCC: /usr/local/cuda-12.9/bin/nvcc
      # nvcc's host compiler for the device TU (env "NVCC_PREPEND_FLAGS
      # -ccbin ..."); CUDA 12.6 rejects gcc > 13, so pin it to the g++-13
      # installed below rather than /usr/bin/g++'s default alias.
      HAWK_NVCC_CCBIN: /usr/bin/g++-13
      # ccache: CMake reads the *_COMPILER_LAUNCHER variables, also under scikit-build-core
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_CUDA_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7
        with:
          path: hawk
          fetch-depth: 0
      - uses: ./hawk/.github/actions/tag-version
        with:
          path: hawk

      # aether/eagle as sibling checkouts; hawk's CMakeLists.txt (via
      # hawk/_roots.py) resolves header roots from $HAWK_AETHER_INCLUDE /
      # $HAWK_EAGLE_INCLUDE directly — no cmake --install step needed, these
      # just need to point at the two repos' source roots.
      # companion aether: the ref pinned in .github/companions, else a same-named branch, else main
      - uses: ./hawk/.github/actions/companion
        with:
          repo: aether
          path: aether
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}
          pins: hawk/.github/companions

      # companion eagle: the ref pinned in .github/companions, else a same-named branch, else main
      - uses: ./hawk/.github/actions/companion
        with:
          repo: eagle
          path: eagle
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}
          pins: hawk/.github/companions

      # companion raptor: the ref pinned in .github/companions, else a same-named branch, else main
      - uses: ./hawk/.github/actions/companion
        with:
          repo: raptor
          path: raptor
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}
          pins: hawk/.github/companions

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            hawk/pyproject.toml
            aether/dsc/pyproject.toml
            raptor/pyproject.toml
            eagle/python/pyproject.toml

      - run: sudo apt-get update && sudo apt-get install -y g++-13 ccache cppcheck

      # compiled objects persist across runs; one cache per job and architecture
      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-v2-${{ runner.os }}-${{ runner.arch }}-test-${{ hashFiles('**/*.h', '**/*.hpp', '**/*.cpp', '**/*.cu', '**/*.cuh', '**/CMakeLists.txt') }}
          restore-keys: |
            ccache-v2-${{ runner.os }}-${{ runner.arch }}-test-
      - run: ccache -z

      - uses: ./hawk/.github/actions/cuda

      # the gate builds its own venv, installs the sibling checkouts as the ci.yml of old did (aether's headers and sealed
      # payload, eagle's binding) and runs the CPU suite and the public-name coverage check: the commands are in the Makefile
      - env:
          GATE_JOBS: "4"
        run: |
          make -C hawk gate-test gate-names \
            RAPTOR_SRC="$GITHUB_WORKSPACE/raptor" AETHER_SRC="$GITHUB_WORKSPACE/aether" EAGLE_SRC="$GITHUB_WORKSPACE/eagle"
      - if: always()
        run: ccache -s

  # host-gcc: the host-compiler matrix. 13.1-13.3 and 14.1-14.2 miscompile a
  # conditional call of a function with masked vector variants; aether-dsc drops
  # those variants there and hawk reports such loops scalar. The sufficiency step
  # is the whole non-GPU suite on each compiler; on 13 and 14 the necessity step
  # forces the masked variants back on and the early-exit host rows must then
  # fail, so the avoidance is shown to be needed.
  host-gcc:
    name: host-gcc (${{ matrix.gcc }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        gcc: [12, 13, 14]
    env:
      CC: gcc-13
      CXX: g++-13
      HAWK_CXX: g++-${{ matrix.gcc }}
      # tests/_toolchain.py's device_compiler(): $HAWK_NVCC first, else the
      # hardcoded /usr/local/cuda-12.9/bin/nvcc, else bare `nvcc` on PATH.
      # Set explicitly so it does not depend on PATH ordering.
      HAWK_NVCC: /usr/local/cuda-12.9/bin/nvcc
      # nvcc's host compiler for the device TU (env "NVCC_PREPEND_FLAGS
      # -ccbin ..."); CUDA 12.6 rejects gcc > 13, so pin it to the g++-13
      # installed below rather than /usr/bin/g++'s default alias.
      HAWK_NVCC_CCBIN: /usr/bin/g++-13
      # ccache: CMake reads the *_COMPILER_LAUNCHER variables, also under scikit-build-core
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_CUDA_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7
        with:
          path: hawk
          fetch-depth: 0
      - uses: ./hawk/.github/actions/tag-version
        with:
          path: hawk

      # aether/eagle as sibling checkouts; hawk's CMakeLists.txt (via
      # hawk/_roots.py) resolves header roots from $HAWK_AETHER_INCLUDE /
      # $HAWK_EAGLE_INCLUDE directly — no cmake --install step needed, these
      # just need to point at the two repos' source roots.
      # companion aether: the ref pinned in .github/companions, else a same-named branch, else main
      - uses: ./hawk/.github/actions/companion
        with:
          repo: aether
          path: aether
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}
          pins: hawk/.github/companions

      # companion eagle: the ref pinned in .github/companions, else a same-named branch, else main
      - uses: ./hawk/.github/actions/companion
        with:
          repo: eagle
          path: eagle
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}
          pins: hawk/.github/companions

      # companion raptor: the ref pinned in .github/companions, else a same-named branch, else main
      - uses: ./hawk/.github/actions/companion
        with:
          repo: raptor
          path: raptor
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}
          pins: hawk/.github/companions

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            hawk/pyproject.toml
            aether/dsc/pyproject.toml
            raptor/pyproject.toml
            eagle/python/pyproject.toml

      - run: sudo apt-get update && sudo apt-get install -y g++-13 g++-${{ matrix.gcc }} ccache cppcheck

      # compiled objects persist across runs; one cache per job and architecture
      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-v2-${{ runner.os }}-${{ runner.arch }}-host-gcc-${{ matrix.gcc }}-${{ hashFiles('**/*.h', '**/*.hpp', '**/*.cpp', '**/*.cu', '**/*.cuh', '**/CMakeLists.txt') }}
          restore-keys: |
            ccache-v2-${{ runner.os }}-${{ runner.arch }}-host-gcc-${{ matrix.gcc }}-
      - run: ccache -z

      - uses: ./hawk/.github/actions/cuda

      # The siblings are on PyPI, but CI installs the sibling checkouts so it tests
      # unreleased changes: aether's header package,
      # raptor, and eagle's Python package (its _core builds against the
      # aether + eagle headers installed into a local prefix).
      - run: |
          cmake -DAETHER_CPP_MODE=OFF -DCMAKE_CUDA_COMPILER="$(which nvcc)" \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/__install" \
            -B aether/build -S aether
          cmake --install aether/build
          cmake -B eagle/__eagle_hdr -S eagle -DCMAKE_CUDA_COMPILER="$(which nvcc)" \
            -DCMAKE_CUDA_ARCHITECTURES=70 \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/__install"
          cmake --install eagle/__eagle_hdr

      - run: |
          python -m pip install --quiet --upgrade pip
          # aether-dsc's payload is sealed at build time (it is not tracked in
          # git): seal it from the sibling checkout, as the release workflow does,
          # in a throwaway venv so the NVRTC packages never reach the test env.
          python -m venv "$RUNNER_TEMP/seal"
          "$RUNNER_TEMP/seal/bin/pip" install --quiet "cuda-bindings" "nvidia-cuda-nvrtc-cu12" "nvidia-cuda-cccl-cu12"
          (cd aether/dsc && "$RUNNER_TEMP/seal/bin/python" -m aether_dsc.seal)
          python -m pip install --quiet ./aether/dsc ./raptor
          export CMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/__install:${CMAKE_PREFIX_PATH}"
          # build deps preinstalled + --no-build-isolation: an isolated build compiles nanobind from a
          # random /tmp build env, so every compile line differs and ccache never hits;
          # --only-binary=:all: still builds this local project but never a dependency from
          # source, so no third-party sdist is ever built without its own isolated env
          python -m pip install --quiet "scikit-build-core>=0.10" "setuptools-scm>=8" "nanobind>=3.1,<4"
          export SKBUILD_CMAKE_ARGS="-DCMAKE_CUDA_COMPILER=$(which nvcc);-DCMAKE_CUDA_ARCHITECTURES=70"
          python -m pip install --quiet --no-build-isolation --only-binary=:all: ./eagle/python

      - env:
          HAWK_AETHER_INCLUDE: ${{ github.workspace }}/aether
          HAWK_EAGLE_INCLUDE: ${{ github.workspace }}/eagle
        run: |
          cd hawk
          python -m pip install --quiet --no-build-isolation --only-binary=:all: -e '.[test]' "numpy>=1.26"

      - env:
          HAWK_AETHER_INCLUDE: ${{ github.workspace }}/aether
          HAWK_EAGLE_INCLUDE: ${{ github.workspace }}/eagle
          RAPTOR_EAGLE_ROOT: ${{ github.workspace }}/eagle
        run: cd hawk && python -m pytest tests -q -m "not gpu"
      - if: matrix.gcc != 12
        name: Necessity (masked variants forced on must fail the early-exit rows)
        env:
          HAWK_AETHER_INCLUDE: ${{ github.workspace }}/aether
          HAWK_EAGLE_INCLUDE: ${{ github.workspace }}/eagle
        run: |
          printf '#!/bin/sh\nexec g++-%s "$@" -DAETHER_HVM_MASKED=1\n' "${{ matrix.gcc }}" > "$RUNNER_TEMP/gxx-masked"
          chmod +x "$RUNNER_TEMP/gxx-masked"
          cd hawk
          set +e
          HAWK_CXX="$RUNNER_TEMP/gxx-masked" python -m pytest tests/test_loop_early_exit.py -q -m "not gpu" \
            -k "middle-host or head_jvp-host or middle_jvp-host"
          rc=$?
          set -e
          if [ "$rc" -ne 1 ]; then
            echo "expected pytest exit 1 (test failures) with masked variants on, got $rc" >&2
            exit 1
          fi
      - if: always()
        run: ccache -s

  # tsan-ft — hawk._core, eagle._core and hawk's run-time host kernels under
  # ThreadSanitizer on a free-threaded CPython built with --with-thread-sanitizer
  # (cached per version + compiler), running the ft rows. Green = the canary race
  # is reported without our suppressions (the detector reaches _core) AND the ft
  # rows give zero reports with them. See tests/sanitize/.
  tsan-ft:
    needs: docs-fresh
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      CXX: clang++-18
      TSAN_PY_VERSION: "3.14.8"
      # the ft rows build their fixture bundles for the device too (compile-only,
      # no GPU): the same nvcc the test/ft-stress jobs use, its host compiler g++-13
      HAWK_NVCC: /usr/local/cuda-12.9/bin/nvcc
      HAWK_NVCC_CCBIN: /usr/bin/g++-13
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7
        with:
          path: hawk
          fetch-depth: 0
      - uses: ./hawk/.github/actions/tag-version
        with:
          path: hawk

      # companion aether: the ref pinned in .github/companions, else a same-named branch, else main
      - uses: ./hawk/.github/actions/companion
        with:
          repo: aether
          path: aether
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}
          pins: hawk/.github/companions

      # companion eagle: the ref pinned in .github/companions, else a same-named branch, else main
      - uses: ./hawk/.github/actions/companion
        with:
          repo: eagle
          path: eagle
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}
          pins: hawk/.github/companions

      # companion raptor: the ref pinned in .github/companions, else a same-named branch, else main
      - uses: ./hawk/.github/actions/companion
        with:
          repo: raptor
          path: raptor
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}
          pins: hawk/.github/companions

      # A pass is remembered under a digest of every input this job reads: the four trees, this workflow (which names the
      # toolchain pins) and the runner image. On a hit the job succeeds without building.
      - id: memo
        run: |
          digest=$(hawk/.github/ci_digest.sh --tree hawk --skip docs/ --skip .github/ --tag hawk --tree aether --skip docs/ --skip .github/ \
            --tree eagle --skip docs/ --skip .github/ --tree raptor --skip docs/ --skip .github/ \
            --file hawk/.github/workflows/ci.yml --str "${ImageVersion:-}") || exit 1
          [ -n "$digest" ] || { echo "::error::empty digest"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - id: pass
        uses: actions/cache/restore@v6
        with:
          path: ci-pass
          key: ci-pass-v2-tsan-ft-${{ steps.memo.outputs.digest }}
          lookup-only: true
      - id: plan
        env:
          HIT: ${{ steps.pass.outputs.cache-hit }}
          DIGEST: ${{ steps.memo.outputs.digest }}
        run: |
          if [ "$HIT" = true ]; then
            echo "tsan-ft: passed earlier on digest $DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo run=true >> "$GITHUB_OUTPUT"
          fi

      # compiled objects persist across runs
      - uses: actions/cache@v6
        if: steps.plan.outputs.run == 'true'
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-v2-${{ runner.os }}-${{ runner.arch }}-tsan-ft-${{ hashFiles('**/*.h', '**/*.hpp', '**/*.cpp', '**/*.cu', '**/*.cuh', '**/CMakeLists.txt') }}
          restore-keys: |
            ccache-v2-${{ runner.os }}-${{ runner.arch }}-tsan-ft-

      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/tsan-python
          key: tsan-python-${{ runner.os }}-${{ runner.arch }}-${{ env.TSAN_PY_VERSION }}-clang18-${{ hashFiles('hawk/tests/sanitize/build_tsan_python.sh') }}
        if: steps.plan.outputs.run == 'true'

      # clang's OpenMP runtime (eagle._core needs OpenMP; gcc's libgomp does not pair with clang)
      - run: sudo apt-get update && sudo apt-get install -y libomp-18-dev ccache
        if: steps.plan.outputs.run == 'true'

      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++-13
        if: steps.plan.outputs.run == 'true'
      - uses: ./hawk/.github/actions/cuda
        if: steps.plan.outputs.run == 'true'

      - run: ccache -z
        if: steps.plan.outputs.run == 'true'
      - name: TSan free-threaded CPython (cached)
        run: hawk/tests/sanitize/build_tsan_python.sh "$TSAN_PY_VERSION" "$RUNNER_TEMP/tsan-python"
        if: steps.plan.outputs.run == 'true'

      # aether + eagle headers for eagle's binding build (CPP mode, no CUDA)
      - run: |
          cmake -DAETHER_CPP_MODE=ON \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/__install" \
            -B aether/build -S aether
          cmake --install aether/build
          cmake -B eagle/__eagle_hdr -S eagle -DEAGLE_CPP_MODE=ON \
            -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/__install" \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/__install"
          cmake --install eagle/__eagle_hdr
        if: steps.plan.outputs.run == 'true'

      - name: ft rows under ThreadSanitizer
        env:
          HAWK_AETHER_INCLUDE: ${{ github.workspace }}/aether
          HAWK_EAGLE_INCLUDE: ${{ github.workspace }}/eagle
        run: |
          cd hawk
          CMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/__install" RAPTOR_DIR="${GITHUB_WORKSPACE}/raptor" AETHER_DIR="${GITHUB_WORKSPACE}/aether" \
            tests/sanitize/tsan_ft.sh "$RUNNER_TEMP/tsan-python/bin/python${TSAN_PY_VERSION%.*}t"
        if: steps.plan.outputs.run == 'true'
      - if: always() && steps.plan.outputs.run == 'true'
        run: ccache -s
      - if: steps.plan.outputs.run == 'true'
        run: mkdir -p ci-pass && touch ci-pass/tsan-ft
      - if: hashFiles('ci-pass/*') != ''
        uses: actions/cache/save@v6
        with:
          path: ci-pass
          key: ci-pass-v2-tsan-ft-${{ steps.memo.outputs.digest }}

  ft-stress:
    needs: docs-fresh
    runs-on: ubuntu-24.04
    strategy:
      # both free-threaded interpreters report, even when one fails
      fail-fast: false
      matrix:
        python-version: ["3.13t", "3.14t"]
    env:
      CC: gcc-13
      CXX: g++-13
      HAWK_CXX: g++-13
      # tests/_toolchain.py's device_compiler(): $HAWK_NVCC first, else the
      # hardcoded /usr/local/cuda-12.9/bin/nvcc, else bare `nvcc` on PATH.
      # Set explicitly so it does not depend on PATH ordering.
      HAWK_NVCC: /usr/local/cuda-12.9/bin/nvcc
      # nvcc's host compiler for the device TU (env "NVCC_PREPEND_FLAGS
      # -ccbin ..."); CUDA 12.6 rejects gcc > 13, so pin it to the g++-13
      # installed below rather than /usr/bin/g++'s default alias.
      HAWK_NVCC_CCBIN: /usr/bin/g++-13
      # ccache: CMake reads the *_COMPILER_LAUNCHER variables, also under scikit-build-core
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_CUDA_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7
        with:
          path: hawk
          fetch-depth: 0
      - uses: ./hawk/.github/actions/tag-version
        with:
          path: hawk

      # aether/eagle as sibling checkouts; hawk's CMakeLists.txt (via
      # hawk/_roots.py) resolves header roots from $HAWK_AETHER_INCLUDE /
      # $HAWK_EAGLE_INCLUDE directly — no cmake --install step needed, these
      # just need to point at the two repos' source roots.
      # companion aether: the ref pinned in .github/companions, else a same-named branch, else main
      - uses: ./hawk/.github/actions/companion
        with:
          repo: aether
          path: aether
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}
          pins: hawk/.github/companions

      # companion eagle: the ref pinned in .github/companions, else a same-named branch, else main
      - uses: ./hawk/.github/actions/companion
        with:
          repo: eagle
          path: eagle
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}
          pins: hawk/.github/companions

      # companion raptor: the ref pinned in .github/companions, else a same-named branch, else main
      - uses: ./hawk/.github/actions/companion
        with:
          repo: raptor
          path: raptor
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}
          pins: hawk/.github/companions

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            hawk/pyproject.toml
            aether/dsc/pyproject.toml
            raptor/pyproject.toml
            eagle/python/pyproject.toml

      - run: sudo apt-get update && sudo apt-get install -y g++-13 ccache cppcheck

      # compiled objects persist across runs; one cache per job and architecture
      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-v2-${{ runner.os }}-${{ runner.arch }}-ft-stress-${{ matrix.python-version }}-${{ hashFiles('**/*.h', '**/*.hpp', '**/*.cpp', '**/*.cu', '**/*.cuh', '**/CMakeLists.txt') }}
          restore-keys: |
            ccache-v2-${{ runner.os }}-${{ runner.arch }}-ft-stress-${{ matrix.python-version }}-
      - run: ccache -z

      - uses: ./hawk/.github/actions/cuda

      # The siblings are on PyPI, but CI installs the sibling checkouts so it tests
      # unreleased changes: aether's header package,
      # raptor, and eagle's Python package (its _core builds against the
      # aether + eagle headers installed into a local prefix).
      - run: |
          cmake -DAETHER_CPP_MODE=OFF -DCMAKE_CUDA_COMPILER="$(which nvcc)" \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/__install" \
            -B aether/build -S aether
          cmake --install aether/build
          cmake -B eagle/__eagle_hdr -S eagle -DCMAKE_CUDA_COMPILER="$(which nvcc)" \
            -DCMAKE_CUDA_ARCHITECTURES=70 \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/__install"
          cmake --install eagle/__eagle_hdr

      - run: |
          # newest NumPy/SciPy ship no cp313t wheel: prefer a wheel over an sdist build
          python -m pip install --quiet --upgrade pip
          # aether-dsc's payload is sealed at build time (it is not tracked in
          # git): seal it from the sibling checkout, as the release workflow does,
          # in a throwaway venv so the NVRTC packages never reach the test env.
          python -m venv "$RUNNER_TEMP/seal"
          "$RUNNER_TEMP/seal/bin/pip" install --quiet --prefer-binary "cuda-bindings" "nvidia-cuda-nvrtc-cu12" "nvidia-cuda-cccl-cu12"
          (cd aether/dsc && "$RUNNER_TEMP/seal/bin/python" -m aether_dsc.seal)
          python -m pip install --quiet --prefer-binary ./aether/dsc ./raptor
          export CMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/__install:${CMAKE_PREFIX_PATH}"
          # build deps preinstalled + --no-build-isolation: an isolated build compiles nanobind from a
          # random /tmp build env, so every compile line differs and ccache never hits;
          # --only-binary=:all: still builds this local project but never a dependency from
          # source, so no third-party sdist is ever built without its own isolated env
          python -m pip install --quiet --prefer-binary "scikit-build-core>=0.10" "setuptools-scm>=8" "nanobind>=3.1,<4"
          export SKBUILD_CMAKE_ARGS="-DCMAKE_CUDA_COMPILER=$(which nvcc);-DCMAKE_CUDA_ARCHITECTURES=70"
          python -m pip install --quiet --no-build-isolation --only-binary=:all: ./eagle/python

      - env:
          HAWK_AETHER_INCLUDE: ${{ github.workspace }}/aether
          HAWK_EAGLE_INCLUDE: ${{ github.workspace }}/eagle
        run: |
          cd hawk
          # SciPy ships no cp313t wheel: take the newest wheel over an sdist build
          python -m pip install --quiet --no-build-isolation --only-binary=:all: -e '.[test]' "numpy>=1.26"

      # An ft leg is vacuous on a GIL interpreter (every ft row skips) and the
      # harness refuses a forced GIL-off (-X gil=0 / PYTHON_GIL): assert the
      # interpreter is free-threaded with the GIL off by default, no override.
      - name: Interpreter is free-threaded, GIL off, no override
        run: |
          [ -z "${PYTHON_GIL:-}" ] || { echo "PYTHON_GIL is set"; exit 1; }
          python -c "import sys; assert sys._is_gil_enabled() is False, 'GIL is enabled'; print(sys.version)"

      # ft rows first: zero collected rows fails the leg (never a green no-op),
      # then the full suite. -W error::RuntimeWarning turns the interpreter's
      # "GIL re-enabled by an extension" warning into a failure.
      - name: ft rows (collected count must be > 0), then the full suite
        env:
          HAWK_AETHER_INCLUDE: ${{ github.workspace }}/aether
          HAWK_EAGLE_INCLUDE: ${{ github.workspace }}/eagle
          RAPTOR_EAGLE_ROOT: ${{ github.workspace }}/eagle
        run: |
          set -euo pipefail
          cd hawk
          N="$(python -m pytest tests -m ft --collect-only -q -p no:cacheprovider | grep -c '::' || true)"
          echo "ft rows collected: $N"
          [ "$N" -gt 0 ] || { echo "ft selection collected zero tests"; exit 1; }
          python -m pytest tests -m ft -q -rs -p no:cacheprovider -W error::RuntimeWarning
          python -m pytest tests -q -p no:cacheprovider -W error::RuntimeWarning -m "not gpu"
      - if: always()
        run: ccache -s


  # The source distributions as a user without matching wheels gets them: the
  # companion eagle's sdist and hawk's, each built as its publish.yml builds it,
  # then pip installed into a clean venv with nothing else provided (no HAWK_*
  # roots, no CMAKE_PREFIX_PATH, no installed headers) and the README host example
  # run. On x86_64 and on aarch64; compiler warnings in our own sources are errors.
  sdist-install:
    needs: docs-fresh
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - uses: actions/checkout@v7
        with:
          path: hawk
          fetch-depth: 0
      - uses: ./hawk/.github/actions/tag-version
        with:
          path: hawk

      # companion aether: the ref pinned in .github/companions, else a same-named branch, else main
      - uses: ./hawk/.github/actions/companion
        with:
          repo: aether
          path: aether
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}
          pins: hawk/.github/companions

      # companion eagle: the ref pinned in .github/companions, else a same-named branch, else main
      - uses: ./hawk/.github/actions/companion
        with:
          repo: eagle
          path: eagle
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}
          pins: hawk/.github/companions

      # companion raptor: used only while its version is not on PyPI yet (a release in flight)
      - uses: ./hawk/.github/actions/companion
        with:
          repo: raptor
          path: raptor
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}
          pins: hawk/.github/companions

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            hawk/pyproject.toml
            aether/dsc/pyproject.toml
            raptor/pyproject.toml
            eagle/python/pyproject.toml

      - run: sudo apt-get update && sudo apt-get install -y g++-13

      # aether-dsc and raptor-core: PyPI when the checkout's version is released, else built from it
      - id: sib
        uses: ./hawk/.github/actions/install-siblings
        with:
          siblings: aether-dsc=aether/dsc raptor-core=raptor

      # The header roots are named for the SDIST step only, as publish.yml does;
      # the install below sees none of them.
      - name: Build both sdists (as their publish.yml do)
        env:
          HAWK_AETHER_INCLUDE: ${{ github.workspace }}/aether
          HAWK_EAGLE_INCLUDE: ${{ github.workspace }}/eagle
        run: |
          python -m pip install --quiet build
          (cd eagle/python && python -m build --sdist --outdir ../../dist)
          (cd hawk && python -m build --sdist --outdir ../dist)
          ls -l dist

      - name: Clean venv, pip install eagle's sdist then hawk's (warnings are errors)
        env:
          SIB_DIR: ${{ steps.sib.outputs.dir }}
          SIB_PINS: ${{ steps.sib.outputs.pins }}
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/venv"
          . "$RUNNER_TEMP/venv/bin/activate"
          pip install --quiet --upgrade pip
          pip install --quiet --prefer-binary --find-links "$SIB_DIR" $SIB_PINS "numpy>=1.26"
          pip install -v -Ccmake.define.EAGLE_PYTHON_WARN_AS_ERR=ON dist/raptor_eagle-*.tar.gz
          pip install -v -Ccmake.define.HAWK_WARN_AS_ERR=ON dist/raptor_hawk-*.tar.gz
          pip check

      - name: The README host example (forward + vjp) on the installed packages
        run: |
          . "$RUNNER_TEMP/venv/bin/activate"
          cd "$RUNNER_TEMP"
          # hawk traces a kernel from its source, so the example runs from a file, not stdin
          cat > readme_example.py <<'PY'
          import pathlib
          import platform
          import tempfile

          import numpy as np

          import eagle
          import hawk
          from hawk import Kernel, Mutable, Scalar, Vector
          from hawk.diff import vjp
          from hawk.math import dot


          @hawk.kernel
          def energy(v: Vector[3], out: Mutable[Scalar]):
              out = 0.5 * dot(v, v)


          energy_vjp = Kernel("energy_vjp", vjp(energy, wrt=("v",)))
          work = pathlib.Path(tempfile.mkdtemp())
          hawk.build([energy, energy_vjp], work, targets=("host",))
          v = np.array([[1.0, 2.0, 3.0, 4.0], [0.0, 1.0, 0.0, 1.0], [0.0, 0.0, 1.0, 1.0]])
          e = np.zeros(4)
          hawk.run(hawk.load(work, "energy"), v=v, out=e)
          assert np.allclose(e, [0.5, 2.5, 5.0, 9.0]), e
          bar_v = np.zeros((3, 4))
          hawk.run(hawk.load(work, "energy_vjp"), v=v, bar_out=np.ones(4), bar_v=bar_v)
          assert np.allclose(bar_v, v), bar_v
          for mod in (eagle._core, hawk._core):
              assert "site-packages" in mod.__file__, mod.__file__
          print(f"OK on {platform.machine()}: energy {e}")
          PY
          python readme_example.py
