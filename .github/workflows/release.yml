# Copyright 2026 Alessandro Masat
# SPDX-License-Identifier: Apache-2.0
#
# Build, check and test everything that ships, on the pull request. The
# artifacts are named by git tree hash, so publish.yml and docs.yml can find
# and upload exactly what was tested here instead of rebuilding it.
#
# hawk._core is a HOST-ONLY nanobind extension (no CUDA language, no arch
# list, no nvcc), so cibuildwheel is needed only for the per-Python/ABI tag.
# The build DOES need the aether and eagle C++ HEADER TREES on disk
# (`hawk/_roots.py` resolves $HAWK_AETHER_INCLUDE / $HAWK_EAGLE_INCLUDE
# against source checkouts), so the manylinux container is given the two
# sibling checkouts as extra bind mounts (`CIBW_CONTAINER_ENGINE` create_args).
#
# Release order across the family: hawk needs aether-dsc. test-wheel installs
# the aether-dsc release matching the requirement the built wheel declares
# from PyPI when one exists (what a user gets), and only otherwise seals and
# builds it from the sibling aether checkout, so this workflow works before
# AND after the family's first release. The sibling repositories are public:
# the default GITHUB_TOKEN checks them out.

name: Release

# Pull requests only: main receives the tested tree, nothing re-runs there.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One leg per architecture; `build` below assembles them. The extension is host-only C++, so both legs are the same
  # build: native runners, no emulation, same Python versions, manylinux_2_28.
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            plat: manylinux_x86_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            plat: manylinux_aarch64
          - arch: macos-arm64
            runner: macos-15
            plat: macosx_arm64
    name: wheels (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    env:
      CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
      CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
      # no isolation, deps installed per Python first: an isolated build env sits at a random
      # /tmp path that lands in every compile line, so ccache could never hit across runs
      CIBW_BUILD_FRONTEND: "build; args: --no-isolation"
      CIBW_BEFORE_BUILD: >-
        python -m pip install 'scikit-build-core>=0.10' 'setuptools-scm>=8' 'ninja>=1.5'
        'nanobind>=3.1,<4; python_version >= "3.10"'
        'nanobind>=2.2,<3; python_version < "3.10"'
      # Extra bind mounts: the sibling header trees are not inside
      # package-dir, so cibuildwheel's default per-package-dir copy
      # never sees them without this.
      CIBW_CONTAINER_ENGINE: "docker; create_args: --volume ${{ github.workspace }}/aether:/sib/aether:ro --volume ${{ github.workspace }}/eagle:/sib/eagle:ro --volume ${{ github.workspace }}/.ccache-cibw:/ccache"
      CIBW_ENVIRONMENT_LINUX: "HAWK_AETHER_INCLUDE=/sib/aether HAWK_EAGLE_INCLUDE=/sib/eagle CMAKE_BUILD_PARALLEL_LEVEL=2 CCACHE_DIR=/ccache CCACHE_MAXSIZE=500M CCACHE_COMPILERCHECK=content CMAKE_C_COMPILER_LAUNCHER=ccache CMAKE_CXX_COMPILER_LAUNCHER=ccache"
      # macOS builds on the runner itself: the header trees are read in place
      CIBW_ENVIRONMENT_MACOS: "HAWK_AETHER_INCLUDE=${{ github.workspace }}/aether HAWK_EAGLE_INCLUDE=${{ github.workspace }}/eagle CCACHE_DIR=${{ github.workspace }}/.ccache-cibw CCACHE_MAXSIZE=500M CCACHE_COMPILERCHECK=content CMAKE_C_COMPILER_LAUNCHER=ccache CMAKE_CXX_COMPILER_LAUNCHER=ccache"
      # ccache from EPEL (AlmaLinux 8); stats zeroed per run, printed before each repair
      # EPEL mirrors fail often on aarch64: retry, then run uncached through a pass-through ccache stand-in
      CIBW_BEFORE_ALL_LINUX: >-
        git config --global --add safe.directory '*';
        for i in 1 2 3; do dnf install -y epel-release && dnf install -y ccache && break; dnf clean all; done;
        command -v ccache >/dev/null || { printf '%s\n' '#!/bin/sh' 'case $1 in -*) exit 0;; esac' 'exec "$@"' > /usr/local/bin/ccache;
        chmod +x /usr/local/bin/ccache; };
        CCACHE_DIR=/ccache ccache -z
      CIBW_REPAIR_WHEEL_COMMAND_LINUX: "ccache -s; auditwheel repair -w {dest_dir} {wheel}"
      # The dedicated test-wheel job below (with the aether-dsc sibling
      # wheel + the repo's own test suite) replaces cibuildwheel's
      # built-in --test-command; skip it here to avoid solving sibling
      # install twice.
      CIBW_TEST_SKIP: "*"
    steps:
      - uses: actions/checkout@v7
        with:
          path: hawk
          fetch-depth: 0
      - uses: ./hawk/.github/actions/tag-version
        with:
          path: hawk

      - uses: ./hawk/.github/actions/companion
        with: {repo: aether, path: aether, pins: hawk/.github/companions, token: "${{ secrets.SIBLING_READ_TOKEN || github.token }}"}

      - uses: ./hawk/.github/actions/companion
        with: {repo: eagle, path: eagle, pins: hawk/.github/companions, token: "${{ secrets.SIBLING_READ_TOKEN || github.token }}"}

      # The finished wheels are remembered under a digest of everything that goes into them: the three header trees, the
      # version, this workflow (cibuildwheel pins) and the platform. A hit skips the build; the checks downstream run on
      # what is restored.
      - id: wk
        env:
          PLAT: ${{ matrix.plat }}
        run: |
          args=(--tree hawk --skip docs/ --skip .github/ --tree aether --skip docs/ --skip .github/ --tree eagle --skip docs/ --skip .github/
                --version hawk --file hawk/.github/workflows/release.yml --str "$PLAT $RUNNER_OS $RUNNER_ARCH")
          if [ "$RUNNER_OS" = Linux ]; then
            args+=(--str "manylinux_2_28 $(docker buildx imagetools inspect "quay.io/pypa/manylinux_2_28_$(uname -m)" --format '{{.Manifest.Digest}}' 2>/dev/null || true)")
          fi
          digest=$(hawk/.github/ci_digest.sh "${args[@]}") || exit 1
          [ -n "$digest" ] || { echo "::error::empty digest"; exit 1; }
          echo "key=wheels-v2-$PLAT-$digest" >> "$GITHUB_OUTPUT"
      - id: wh
        uses: actions/cache@v6
        with:
          path: dist
          key: ${{ steps.wk.outputs.key }}
      - if: steps.wh.outputs.cache-hit == 'true'
        run: ls -l dist

      # ccache inside the manylinux container: the runner directory is bind-mounted at /ccache; on macOS the build reads it in place
      - if: steps.wh.outputs.cache-hit != 'true'
        run: mkdir -p .ccache-cibw
      - if: steps.wh.outputs.cache-hit != 'true' && runner.os == 'macOS'
        run: brew install ccache
      - uses: actions/cache@v6
        if: steps.wh.outputs.cache-hit != 'true'
        with:
          path: ${{ github.workspace }}/.ccache-cibw
          key: ccache-v2-${{ runner.os }}-${{ runner.arch }}-cibw-${{ hashFiles('**/*.h', '**/*.hpp', '**/*.cpp', '**/*.cu', '**/*.cuh', '**/CMakeLists.txt') }}
          restore-keys: |
            ccache-v2-${{ runner.os }}-${{ runner.arch }}-cibw-

      - name: Build wheels (cibuildwheel 3.x; CPython 3.9-3.14 plus free-threaded 3.14t)
        if: steps.wh.outputs.cache-hit != 'true'
        uses: pypa/cibuildwheel@v3.4.1
        with:
          package-dir: hawk
          output-dir: dist
        env:
          CIBW_BUILD: "cp39-${{ matrix.plat }} cp310-${{ matrix.plat }} cp311-${{ matrix.plat }} cp312-${{ matrix.plat }} cp313-${{ matrix.plat }} cp314-${{ matrix.plat }} cp314t-${{ matrix.plat }}"
      # the 4.x line dropped the CPython 3.13 free-threading build, so cp313t stays on 3.x, where it needs
      # the cpython-freethreading enable group (deprecated for later tags, and it warns); scoped to this one build
      - name: Build the free-threaded CPython 3.13t wheel (cibuildwheel 3.x)
        if: steps.wh.outputs.cache-hit != 'true'
        uses: pypa/cibuildwheel@v3.4.1
        with:
          package-dir: hawk
          output-dir: dist
        env:
          CIBW_ENABLE: cpython-freethreading
          CIBW_BUILD: "cp313t-${{ matrix.plat }}"
      # 3.15 needs cibuildwheel 4.x: a second pass for the 3.15 tags only
      - name: Build the CPython 3.15 and 3.15t wheels (cibuildwheel 4.x)
        if: steps.wh.outputs.cache-hit != 'true'
        uses: pypa/cibuildwheel@v4.3.3
        with:
          package-dir: hawk
          output-dir: dist
        env:
          CIBW_ENABLE: ""
          CIBW_BUILD: "cp315-${{ matrix.plat }} cp315t-${{ matrix.plat }}"
      # on Linux the stats are printed inside the container, before each repair
      - if: always() && steps.wh.outputs.cache-hit != 'true' && runner.os == 'macOS'
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache-cibw
        run: ccache -s

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.arch }}
          retention-days: 7
          path: dist/

  # Assembles what `wheels` built into the one artifact the rest of the workflow and publish.yml use.
  build:
    needs: wheels
    outputs:
      tree: ${{ steps.tree.outputs.tree }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: hawk
          fetch-depth: 0
      - uses: ./hawk/.github/actions/tag-version
        with:
          path: hawk

      - uses: ./hawk/.github/actions/companion
        with: {repo: aether, path: aether, pins: hawk/.github/companions, token: "${{ secrets.SIBLING_READ_TOKEN || github.token }}"}

      - uses: ./hawk/.github/actions/companion
        with: {repo: eagle, path: eagle, pins: hawk/.github/companions, token: "${{ secrets.SIBLING_READ_TOKEN || github.token }}"}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hawk/pyproject.toml

      - run: python -m pip install --quiet build "twine>=6" pyyaml

      - name: publish and deploy workflows only download, verify and upload
        run: python hawk/tools/ci_publish_subset.py

      # sdist: scikit-build-core's sdist still needs the two header roots to stamp hawk's build digest
      # at configure time (CMakeLists.txt point 3).
      - name: Build the sdist
        env:
          HAWK_AETHER_INCLUDE: ${{ github.workspace }}/aether
          HAWK_EAGLE_INCLUDE: ${{ github.workspace }}/eagle
        run: cd hawk && python -m build --sdist --outdir ../dist

      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Ten wheels per platform (3.9-3.15 plus 3.13t, 3.14t, 3.15t), none unrepaired
        run: |
          for plat in manylinux*_x86_64 manylinux*_aarch64 macosx_*_arm64; do
            n=$(find dist -name "*-${plat}.whl" | wc -l)
            [ "$n" -eq 10 ] || { echo "::error::$n wheels for $plat, expected 10"; exit 1; }
          done
          [ "$(find dist -name '*.whl' | wc -l)" -eq 30 ] || { echo "::error::unexpected wheel in dist"; ls dist; exit 1; }
          echo "OK: 10 wheels each for x86_64, aarch64 and macOS arm64"

      - run: python -m twine check --strict dist/*

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS

      - id: tree
        run: echo "tree=$(git -C hawk rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ steps.tree.outputs.tree }}
          retention-days: 90
          path: dist/

  test-wheel:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      # every Python version reports, even when one fails
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15", "3.13t", "3.14t", "3.15t"]
    # The suite's toolchain, exactly as ci.yml's test job sets it: the
    # fixture kernels build for BOTH the host and the cuda target (nvcc AOT
    # compile only, never executed), so a compile-only CUDA 12.6 toolchain
    # and g++-13 are installed below.
    env:
      CC: gcc-13
      CXX: g++-13
      HAWK_CXX: g++-13
      HAWK_NVCC: /usr/local/cuda-12.9/bin/nvcc
      HAWK_NVCC_CCBIN: /usr/bin/g++-13
    steps:
      - uses: actions/checkout@v7
        with:
          path: hawk
          fetch-depth: 0
      - uses: ./hawk/.github/actions/tag-version
        with:
          path: hawk
      - uses: ./hawk/.github/actions/companion
        with: {repo: aether, path: aether, pins: hawk/.github/companions, token: "${{ secrets.SIBLING_READ_TOKEN || github.token }}"}
      - uses: ./hawk/.github/actions/companion
        with: {repo: eagle, path: eagle, pins: hawk/.github/companions, token: "${{ secrets.SIBLING_READ_TOKEN || github.token }}"}
      - uses: ./hawk/.github/actions/companion
        with: {repo: raptor, path: raptor, pins: hawk/.github/companions, token: "${{ secrets.SIBLING_READ_TOKEN || github.token }}"}
      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ needs.build.outputs.tree }}
          path: dist
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true  # 3.15 until its release is on the runner image
          cache: pip
          cache-dependency-path: |
            hawk/pyproject.toml
            aether/dsc/pyproject.toml
            raptor/pyproject.toml
            eagle/python/pyproject.toml

      - run: sudo apt-get update && sudo apt-get install -y g++-13 cppcheck

      - uses: ./hawk/.github/actions/cuda

      # aether-dsc (hawk's runtime dependency) and the test-only eagle + raptor-core: each from PyPI when
      # its checkout's version is released, else built from the checkout. The exact version matters: an
      # older eagle on PyPI cannot load what this hawk emits during a release.
      - id: sib
        uses: ./hawk/.github/actions/install-siblings
        with:
          siblings: aether-dsc=aether/dsc raptor-eagle=eagle/python raptor-core=raptor

      # The siblings first (PyPI or built above; eagle builds from its sdist here), then raptor-hawk from
      # THIS run's dist only (never an index copy of the same version), then the [test] extras.
      - name: Fresh venv, install hawk + aether-dsc, pip check
        env:
          SIB_DIR: ${{ steps.sib.outputs.dir }}
          SIB_PINS: ${{ steps.sib.outputs.pins }}
        run: |
          set -euo pipefail
          python -m venv venv
          . venv/bin/activate
          export SKBUILD_CMAKE_ARGS="-DCMAKE_CUDA_COMPILER=$(which nvcc);-DCMAKE_CUDA_ARCHITECTURES=70"
          # newest NumPy/SciPy ship no cp313t wheel: prefer a wheel over an sdist build
          pip install --quiet --prefer-binary --find-links "$SIB_DIR" $SIB_PINS numpy
          pip install --quiet --no-index --only-binary=raptor-hawk --find-links dist raptor-hawk
          pip install --quiet --prefer-binary --find-links dist --find-links "$SIB_DIR" "raptor-hawk[test]" $SIB_PINS
          pip check

      - name: Import smoke (the import-time build-digest/layout self-check runs here)
        run: |
          . venv/bin/activate
          want=$(ls dist/raptor_hawk-*.whl | head -n 1 | xargs basename | cut -d- -f2)   # every wheel carries the same version
          python - <<EOF
          import hawk, pathlib, sys
          print("hawk", hawk.__version__, hawk.__file__)
          assert hawk.__version__ == "$want", hawk.__version__
          assert pathlib.Path(hawk.__file__).is_relative_to(sys.prefix), hawk.__file__
          EOF

      - name: The repo's own non-GPU suite (a copy outside the repo, against the installed wheel)
        env:
          HAWK_AETHER_INCLUDE: ${{ github.workspace }}/aether
          HAWK_EAGLE_INCLUDE: ${{ github.workspace }}/eagle
        run: |
          . venv/bin/activate
          mkdir -p suite
          cp -r hawk/tests suite/tests
          cp hawk/pyproject.toml suite/pyproject.toml
          cd suite
          python -m pytest tests -q -m "not gpu and not repo_local"

      # Free-threaded legs only (3.13t / 3.14t): the ft rows against the INSTALLED
      # wheel, then the whole suite with RuntimeWarning as an error (a re-enabled
      # GIL is that warning). Zero collected ft rows fails the leg, and the
      # interpreter must be GIL-off by default with no override set.
      - name: ft-stress (ft rows + full suite, -W error::RuntimeWarning)
        if: endsWith(matrix.python-version, 't')
        env:
          HAWK_AETHER_INCLUDE: ${{ github.workspace }}/aether
          HAWK_EAGLE_INCLUDE: ${{ github.workspace }}/eagle
        run: |
          set -euo pipefail
          . venv/bin/activate
          [ -z "${PYTHON_GIL:-}" ] || { echo "PYTHON_GIL is set"; exit 1; }
          python -c "import sys; assert sys._is_gil_enabled() is False, 'GIL is enabled'"
          mkdir -p suite-ft
          cp -r hawk/tests suite-ft/tests
          cp hawk/pyproject.toml suite-ft/pyproject.toml
          cd suite-ft
          N="$(python -m pytest tests -m "ft and not repo_local" --collect-only -q -p no:cacheprovider | grep -c '::' || true)"
          echo "ft rows collected: $N"
          [ "$N" -gt 0 ] || { echo "ft selection collected zero tests"; exit 1; }
          python -m pytest tests -m "ft and not repo_local" -q -rs -p no:cacheprovider -W error::RuntimeWarning
          python -m pytest tests -q -p no:cacheprovider -W error::RuntimeWarning -m "not gpu and not repo_local"

  # The aarch64 and macOS arm64 wheels, installed and run on native runners: host build and run of the README example,
  # forward and vjp. The x86_64 test-wheel above also needs the compile-only CUDA toolchain, which is x86_64 only.
  test-wheel-cpu:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-15]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15", "3.13t", "3.14t", "3.15t"]
    env:
      # the runner's bundled pip (22.x on 3.9) nags about a newer release on every call
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      # macOS: Homebrew's LLVM clang (C++23-complete); Apple's clang 15 rejects -std=c++23 (Apple clang support: a later release)
      HAWK_CXX: ${{ matrix.os == 'macos-15' && '/opt/homebrew/opt/llvm/bin/clang++' || 'g++-13' }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: hawk
          fetch-depth: 0
      - uses: ./hawk/.github/actions/tag-version
        with:
          path: hawk
      - uses: ./hawk/.github/actions/companion
        with: {repo: aether, path: aether, pins: hawk/.github/companions, token: "${{ secrets.SIBLING_READ_TOKEN || github.token }}"}
      - uses: ./hawk/.github/actions/companion
        with: {repo: eagle, path: eagle, pins: hawk/.github/companions, token: "${{ secrets.SIBLING_READ_TOKEN || github.token }}"}
      - uses: ./hawk/.github/actions/companion
        with: {repo: raptor, path: raptor, pins: hawk/.github/companions, token: "${{ secrets.SIBLING_READ_TOKEN || github.token }}"}
      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ needs.build.outputs.tree }}
          path: dist
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true  # 3.15 until its release is on the runner image
          cache: pip
          cache-dependency-path: |
            hawk/pyproject.toml
            aether/dsc/pyproject.toml
            raptor/pyproject.toml
            eagle/python/pyproject.toml
      - run: sudo apt-get update && sudo apt-get install -y g++-13
        if: runner.os == 'Linux'
      # libomp: eagle builds from its sdist here until 0.6.x is on PyPI, and its host core needs OpenMP; llvm: HAWK_CXX above
      - run: brew install libomp llvm && { echo "OpenMP_ROOT=$(brew --prefix libomp)"; echo "CMAKE_PREFIX_PATH=$(brew --prefix libomp)"; } >> "$GITHUB_ENV"
        if: runner.os == 'macOS'
      # eagle is the test-only sibling: PyPI when released, else built from its sdist here (CPU-only on ARM)
      - id: sib
        uses: ./hawk/.github/actions/install-siblings
        with:
          siblings: aether-dsc=aether/dsc raptor-eagle=eagle/python raptor-core=raptor
      - name: Fresh venv, install the aarch64 wheel, pip check
        env:
          SIB_DIR: ${{ steps.sib.outputs.dir }}
          SIB_PINS: ${{ steps.sib.outputs.pins }}
        run: |
          set -euo pipefail
          python -m venv venv
          . venv/bin/activate
          # shellcheck disable=SC2086  # the pins are separate arguments
          pip install --quiet --prefer-binary --find-links "$SIB_DIR" $SIB_PINS numpy
          pip install --quiet --no-index --only-binary=raptor-hawk --find-links dist raptor-hawk
          pip check
      - name: The README host example (forward + vjp) on the installed wheel
        run: |
          . venv/bin/activate
          cd "$RUNNER_TEMP"
          # hawk traces a kernel from its source, so the example runs from a file, not stdin
          cat > readme_example.py <<'PY'
          import os
          import pathlib
          import platform

          import numpy as np

          import hawk
          from hawk import Kernel, Mutable, Scalar, Vector
          from hawk.diff import vjp
          from hawk.math import dot


          @hawk.kernel
          def energy(v: Vector[3], out: Mutable[Scalar]):
              out = 0.5 * dot(v, v)


          energy_vjp = Kernel("energy_vjp", vjp(energy, wrt=("v",)))
          work = pathlib.Path(os.environ["HAWK_WORK"])
          work.mkdir()
          hawk.build([energy, energy_vjp], work, targets=("host",))
          v = np.array([[1.0, 2.0, 3.0, 4.0], [0.0, 1.0, 0.0, 1.0], [0.0, 0.0, 1.0, 1.0]])
          e = np.zeros(4)
          hawk.run(hawk.load(work, "energy"), v=v, out=e)
          assert np.allclose(e, [0.5, 2.5, 5.0, 9.0]), e
          bar_v = np.zeros((3, 4))
          hawk.run(hawk.load(work, "energy_vjp"), v=v, bar_out=np.ones(4), bar_v=bar_v)
          assert np.allclose(bar_v, v), bar_v
          assert platform.machine() in ("aarch64", "arm64"), platform.machine()
          assert "site-packages" in hawk._core.__file__, hawk._core.__file__
          print(f"OK on {platform.machine()}: energy {e}")
          PY
          HAWK_WORK="$RUNNER_TEMP/hawk_work" python readme_example.py
      # Reports, never fails: does the compiled host loop use NEON (fmla v.2d) or SVE (z registers)?
      - name: Probe whether the ARM host loop vectorises
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: |
          for so in "$RUNNER_TEMP"/hawk_work/*.so; do
            echo "$so: fmla v.2d = $(objdump -d "$so" | grep -cE 'fmla\s+v[0-9]+\.2d'), sve z-register ops = $(objdump -d "$so" | grep -cE '\sz[0-9]+\.d')" | tee -a "$GITHUB_STEP_SUMMARY"
          done

  docs:
    runs-on: ubuntu-latest
    env:
      CC: gcc-13
      CXX: g++-13
      HAWK_CXX: g++-13
      HAWK_NVCC: /usr/local/cuda-12.9/bin/nvcc
      HAWK_NVCC_CCBIN: /usr/bin/g++-13
      # ccache: CMake reads the *_COMPILER_LAUNCHER variables, also under scikit-build-core
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_CUDA_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7
        with:
          path: hawk
          fetch-depth: 0
      - uses: ./hawk/.github/actions/tag-version
        with:
          path: hawk

      - uses: ./hawk/.github/actions/companion
        with: {repo: aether, path: aether, pins: hawk/.github/companions, token: "${{ secrets.SIBLING_READ_TOKEN || github.token }}"}

      - uses: ./hawk/.github/actions/companion
        with: {repo: eagle, path: eagle, pins: hawk/.github/companions, token: "${{ secrets.SIBLING_READ_TOKEN || github.token }}"}

      - uses: ./hawk/.github/actions/companion
        with: {repo: raptor, path: raptor, pins: hawk/.github/companions, token: "${{ secrets.SIBLING_READ_TOKEN || github.token }}"}

      - uses: ./hawk/.github/actions/companion
        with: {repo: amasat01.github.io, path: site, pins: hawk/.github/companions, token: "${{ secrets.SIBLING_READ_TOKEN || github.token }}"}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            hawk/pyproject.toml
            aether/dsc/pyproject.toml
            raptor/pyproject.toml
            eagle/python/pyproject.toml
            hawk/docs/requirements.txt

      - run: sudo apt-get update && sudo apt-get install -y g++-13 ccache cppcheck

      # compiled objects persist across runs; one cache per job and architecture
      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-v2-${{ runner.os }}-${{ runner.arch }}-docs-${{ hashFiles('**/*.h', '**/*.hpp', '**/*.cpp', '**/*.cu', '**/*.cuh', '**/CMakeLists.txt') }}
          restore-keys: |
            ccache-v2-${{ runner.os }}-${{ runner.arch }}-docs-
      - run: ccache -z

      - uses: ./hawk/.github/actions/cuda

      # the gate's venv carries the sibling checkouts as before; it runs every notebook on the CPU, the strict (-W) Sphinx build
      # and the public-name page check: the commands are in the Makefile
      - env:
          GATE_JOBS: "4"
        run: |
          make -C hawk gate-docs SITE_SRC="$GITHUB_WORKSPACE/site" \
            RAPTOR_SRC="$GITHUB_WORKSPACE/raptor" AETHER_SRC="$GITHUB_WORKSPACE/aether" EAGLE_SRC="$GITHUB_WORKSPACE/eagle"

      - id: tree
        run: echo "tree=$(git -C hawk rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: site-${{ steps.tree.outputs.tree }}
          retention-days: 90
          path: hawk/docs/_build/html
      - if: always()
        run: ccache -s

  # Informational: a docs-only PR carries an already published version.
  pypi-version:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ needs.build.outputs.tree }}
          path: dist
      - run: |
          whl=$(ls dist/*.whl | head -n 1 | xargs basename)
          version=$(echo "$whl" | cut -d- -f2)
          if curl -fsS "https://pypi.org/pypi/raptor-hawk/${version}/json" > /dev/null; then
            echo "::notice::raptor-hawk ${version} is already on PyPI; a release needs a version bump"
          else
            echo "::notice::raptor-hawk ${version} is not on PyPI yet"
          fi
