# SPDX-License-Identifier: Apache-2.0
#
# Build, check and test everything that ships, on the pull request. The
# artifacts are named by git tree hash, so publish.yml and docs.yml can find
# and upload exactly what was tested here instead of rebuilding it.
#
# hawk._core is a HOST-ONLY nanobind extension (no CUDA language, no arch
# list, no nvcc), so cibuildwheel is needed only for the per-Python/ABI tag.
# The build DOES need the aether and eagle C++ HEADER TREES on disk
# (`hawk/_roots.py` resolves $HAWK_AETHER_INCLUDE / $HAWK_EAGLE_INCLUDE
# against source checkouts), so the manylinux container is given the two
# sibling checkouts as extra bind mounts (`CIBW_CONTAINER_ENGINE` create_args).
#
# Release order across the family: hawk needs aether-dsc. test-wheel installs
# the aether-dsc release matching the requirement the built wheel declares
# from PyPI when one exists (what a user gets), and only otherwise seals and
# builds it from the sibling aether checkout, so this workflow works before
# AND after the family's first release. The sibling repositories are public:
# the default GITHUB_TOKEN checks them out.

name: Release

# Pull requests only: main receives the tested tree, nothing re-runs there.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    outputs:
      tree: ${{ steps.tree.outputs.tree }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: hawk

      - uses: ./hawk/.github/actions/companion
        with: {repo: aether, path: aether, pins: hawk/.github/companions, token: "${{ secrets.SIBLING_READ_TOKEN || github.token }}"}

      - uses: ./hawk/.github/actions/companion
        with: {repo: eagle, path: eagle, pins: hawk/.github/companions, token: "${{ secrets.SIBLING_READ_TOKEN || github.token }}"}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hawk/pyproject.toml

      - run: python -m pip install --quiet build "twine>=6" pyyaml

      - name: publish and deploy workflows only download, verify and upload
        run: python hawk/tools/ci_publish_subset.py

      # sdist first: pure-python-looking metadata, but scikit-build-core's
      # sdist still needs the two header roots to stamp hawk's build digest
      # at configure time (CMakeLists.txt point 3) — only the compiled
      # wheels are built through cibuildwheel below.
      - name: Build the sdist
        env:
          HAWK_AETHER_INCLUDE: ${{ github.workspace }}/aether
          HAWK_EAGLE_INCLUDE: ${{ github.workspace }}/eagle
        run: cd hawk && python -m build --sdist --outdir ../dist

      # ccache inside the manylinux container: the runner directory is bind-mounted at /ccache
      - run: mkdir -p .ccache-cibw
      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache-cibw
          key: ccache-v2-${{ runner.os }}-${{ runner.arch }}-cibw-${{ hashFiles('**/*.h', '**/*.hpp', '**/*.cpp', '**/*.cu', '**/*.cuh', '**/CMakeLists.txt') }}
          restore-keys: |
            ccache-v2-${{ runner.os }}-${{ runner.arch }}-cibw-

      - name: Build manylinux wheels (cibuildwheel; CPython 3.9-3.14 + free-threaded 3.13t/3.14t, x86_64)
        uses: pypa/cibuildwheel@v3.4.1
        with:
          package-dir: hawk
          output-dir: dist
        env:
          CIBW_BUILD: "cp39-manylinux_x86_64 cp310-manylinux_x86_64 cp311-manylinux_x86_64 cp312-manylinux_x86_64 cp313-manylinux_x86_64 cp314-manylinux_x86_64 cp313t-manylinux_x86_64 cp314t-manylinux_x86_64"
          # cibuildwheel 4.x dropped the CPython 3.13 free-threading builds, so
          # the pin stays on 3.x, where cp313t needs this enable group.
          CIBW_ENABLE: cpython-freethreading
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          # no isolation, deps installed per Python first: an isolated build env sits at a random
          # /tmp path that lands in every compile line, so ccache could never hit across runs
          CIBW_BUILD_FRONTEND: "build; args: --no-isolation"
          CIBW_BEFORE_BUILD: >-
            python -m pip install 'scikit-build-core>=0.10' 'ninja>=1.5'
            'nanobind>=3.1,<4; python_version >= "3.10"'
            'nanobind>=2.2,<3; python_version < "3.10"'
          # Extra bind mounts: the sibling header trees are not inside
          # package-dir, so cibuildwheel's default per-package-dir copy
          # never sees them without this.
          CIBW_CONTAINER_ENGINE: "docker; create_args: --volume ${{ github.workspace }}/aether:/sib/aether:ro --volume ${{ github.workspace }}/eagle:/sib/eagle:ro --volume ${{ github.workspace }}/.ccache-cibw:/ccache"
          CIBW_ENVIRONMENT_LINUX: "HAWK_AETHER_INCLUDE=/sib/aether HAWK_EAGLE_INCLUDE=/sib/eagle CMAKE_BUILD_PARALLEL_LEVEL=2 CCACHE_DIR=/ccache CCACHE_MAXSIZE=500M CCACHE_COMPILERCHECK=content CMAKE_C_COMPILER_LAUNCHER=ccache CMAKE_CXX_COMPILER_LAUNCHER=ccache"
          # ccache from EPEL (AlmaLinux 8); stats zeroed per run, printed before each repair
          CIBW_BEFORE_ALL_LINUX: "dnf install -y epel-release && dnf install -y ccache && CCACHE_DIR=/ccache ccache -z"
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: "ccache -s; auditwheel repair -w {dest_dir} {wheel}"
          # The dedicated test-wheel job below (with the aether-dsc sibling
          # wheel + the repo's own test suite) replaces cibuildwheel's
          # built-in --test-command; skip it here to avoid solving sibling
          # install twice.
          CIBW_TEST_SKIP: "*"

      - run: python -m twine check --strict dist/*

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS

      - id: tree
        run: echo "tree=$(git -C hawk rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ steps.tree.outputs.tree }}
          retention-days: 90
          path: dist/

  test-wheel:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      # every Python version reports, even when one fails
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.13t", "3.14t"]
    # The suite's toolchain, exactly as ci.yml's test job sets it: the
    # fixture kernels build for BOTH the host and the cuda target (nvcc AOT
    # compile only, never executed), so a compile-only CUDA 12.6 toolchain
    # and g++-13 are installed below.
    env:
      CC: gcc-13
      CXX: g++-13
      HAWK_CXX: g++-13
      HAWK_NVCC: /usr/local/cuda-12.6/bin/nvcc
      HAWK_NVCC_CCBIN: /usr/bin/g++-13
    steps:
      - uses: actions/checkout@v7
        with:
          path: hawk
      - uses: ./hawk/.github/actions/companion
        with: {repo: aether, path: aether, pins: hawk/.github/companions, token: "${{ secrets.SIBLING_READ_TOKEN || github.token }}"}
      - uses: ./hawk/.github/actions/companion
        with: {repo: eagle, path: eagle, pins: hawk/.github/companions, token: "${{ secrets.SIBLING_READ_TOKEN || github.token }}"}
      - uses: ./hawk/.github/actions/companion
        with: {repo: raptor, path: raptor, pins: hawk/.github/companions, token: "${{ secrets.SIBLING_READ_TOKEN || github.token }}"}
      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ needs.build.outputs.tree }}
          path: dist
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            hawk/pyproject.toml
            aether/dsc/pyproject.toml
            raptor/pyproject.toml
            eagle/python/pyproject.toml

      # aether-dsc, hawk's one runtime dependency, resolved against the
      # requirement the BUILT wheel declares: from PyPI when a matching
      # release exists (what a user gets), otherwise sealed and built from
      # the sibling aether checkout (before the family's first release).
      # Sealing runs the NVRTC-clean gate, so that branch needs NVRTC plus
      # the CCCL headers from PyPI (the runner has no CUDA toolkit).
      - name: aether-dsc wheel (PyPI if released, else the sibling checkout)
        run: |
          set -euo pipefail
          # newest NumPy/SciPy ship no cp313t wheel: prefer a wheel over an sdist build
          python -m pip install --quiet --prefer-binary build
          REQ="$(python - <<'PY'
          import glob, zipfile
          whl = sorted(glob.glob("dist/*.whl"))[0]
          with zipfile.ZipFile(whl) as z:
              meta = next(n for n in z.namelist() if n.endswith(".dist-info/METADATA"))
              for line in z.read(meta).decode().splitlines():
                  if line.startswith("Requires-Dist:") and "aether-dsc" in line and "extra ==" not in line:
                      print(line.split(":", 1)[1].strip()); break
              else:
                  raise SystemExit(f"{whl} declares no aether-dsc requirement")
          PY
          )"
          echo "hawk requires: $REQ"
          mkdir -p dist-dsc
          if python -m pip download --quiet --no-deps --only-binary=:all: -d dist-dsc "$REQ"; then
            echo "aether-dsc: from PyPI"
          else
            echo "aether-dsc: not on PyPI yet, building it from the sibling checkout"
            python -m pip install --quiet --prefer-binary "cuda-bindings" "nvidia-cuda-nvrtc-cu12" "nvidia-cuda-cccl-cu12"
            (cd aether/dsc && python -m aether_dsc.seal && python -m build --wheel --outdir ../../dist-dsc)
          fi
          ls dist-dsc

      - run: sudo apt-get update && sudo apt-get install -y g++-13

      - uses: ./hawk/.github/actions/cuda-toolchain

      # eagle and raptor-core are TEST-only for hawk (the suite drives
      # kernels through eagle; neither is a declared dependency). Same rule
      # as aether-dsc: the released wheels from PyPI when the sibling
      # checkouts' own versions are released, else built from those
      # checkouts the way ci.yml builds them. The exact version matters: an
      # older eagle on PyPI cannot load what this hawk emits during a release.
      - name: eagle + raptor-core wheels (PyPI if released, else the sibling checkouts)
        run: |
          set -euo pipefail
          mkdir -p dist-sib
          EAGLE_V=$(sed -n 's/^version = "\(.*\)"/\1/p' eagle/python/pyproject.toml)
          CORE_V=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' raptor/raptor/version.py)
          echo "EAGLE_V=$EAGLE_V" >> "$GITHUB_ENV"
          echo "sibling versions: raptor-eagle $EAGLE_V, raptor-core $CORE_V"
          if python -m pip download --quiet --only-binary=:all: -d dist-sib \
               "raptor-eagle==$EAGLE_V" "raptor-core==$CORE_V"; then
            echo "raptor-eagle (+ raptor-core): from PyPI"
          else
            echo "raptor-eagle: not on PyPI yet, building it from the sibling checkouts"
            cmake -DAETHER_CPP_MODE=OFF -DCMAKE_CUDA_COMPILER="$(which nvcc)" \
              -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/__install" \
              -B aether/build -S aether
            cmake --install aether/build
            cmake -B eagle/__eagle_hdr -S eagle -DCMAKE_CUDA_COMPILER="$(which nvcc)" \
              -DCMAKE_CUDA_ARCHITECTURES=70 \
              -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/__install"
            cmake --install eagle/__eagle_hdr
            export CMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/__install"
            export SKBUILD_CMAKE_ARGS="-DCMAKE_CUDA_COMPILER=$(which nvcc);-DCMAKE_CUDA_ARCHITECTURES=70"
            (cd eagle/python && python -m build --wheel --outdir ../../dist-sib)
            if ! python -m pip download --quiet --no-deps --only-binary=:all: -d dist-sib "raptor-core==$CORE_V"; then
              (cd raptor && python -m build --wheel --outdir ../dist-sib)
            fi
          fi
          ls dist-sib

      # Three installs, so each piece provably comes from where it should:
      # aether-dsc from dist-dsc, raptor-hawk from THIS run's dist (never an
      # index copy of the same version), then the [test] extras from PyPI
      # (pytest, numpy, scipy are third-party; hawk is already satisfied)
      # together with the test-only eagle (+ raptor-core) from dist-sib.
      - name: Fresh venv, install hawk + aether-dsc, pip check
        run: |
          set -euo pipefail
          python -m venv venv
          . venv/bin/activate
          pip install --quiet --no-index --find-links dist-dsc aether-dsc
          # hawk's one third-party runtime dependency comes from PyPI; hawk and
          # aether-dsc themselves only from the wheels built in this run
          pip install --quiet --prefer-binary numpy
          pip install --quiet --no-index --find-links dist --find-links dist-dsc raptor-hawk
          pip install --quiet --prefer-binary --find-links dist --find-links dist-sib "raptor-hawk[test]" "raptor-eagle==$EAGLE_V"
          pip check

      - name: Import smoke (the import-time build-digest/layout self-check runs here)
        run: |
          . venv/bin/activate
          python - <<'EOF'
          import hawk, pathlib, sys
          print("hawk", hawk.__version__, hawk.__file__)
          assert pathlib.Path(hawk.__file__).is_relative_to(sys.prefix), hawk.__file__
          EOF

      - name: The repo's own non-GPU suite (a copy outside the repo, against the installed wheel)
        env:
          HAWK_AETHER_INCLUDE: ${{ github.workspace }}/aether
          HAWK_EAGLE_INCLUDE: ${{ github.workspace }}/eagle
        run: |
          . venv/bin/activate
          mkdir -p suite
          cp -r hawk/tests suite/tests
          cp hawk/pyproject.toml suite/pyproject.toml
          cd suite
          python -m pytest tests -q -m "not gpu and not repo_local"

      # Free-threaded legs only (3.13t / 3.14t): the ft rows against the INSTALLED
      # wheel, then the whole suite with RuntimeWarning as an error (a re-enabled
      # GIL is that warning). Zero collected ft rows fails the leg, and the
      # interpreter must be GIL-off by default with no override set.
      - name: ft-stress (ft rows + full suite, -W error::RuntimeWarning)
        if: endsWith(matrix.python-version, 't')
        env:
          HAWK_AETHER_INCLUDE: ${{ github.workspace }}/aether
          HAWK_EAGLE_INCLUDE: ${{ github.workspace }}/eagle
        run: |
          set -euo pipefail
          . venv/bin/activate
          [ -z "${PYTHON_GIL:-}" ] || { echo "PYTHON_GIL is set"; exit 1; }
          python -c "import sys; assert sys._is_gil_enabled() is False, 'GIL is enabled'"
          mkdir -p suite-ft
          cp -r hawk/tests suite-ft/tests
          cp hawk/pyproject.toml suite-ft/pyproject.toml
          cd suite-ft
          N="$(python -m pytest tests -m "ft and not repo_local" --collect-only -q -p no:cacheprovider | grep -c '::' || true)"
          echo "ft rows collected: $N"
          [ "$N" -gt 0 ] || { echo "ft selection collected zero tests"; exit 1; }
          python -m pytest tests -m "ft and not repo_local" -q -rs -p no:cacheprovider -W error::RuntimeWarning
          python -m pytest tests -q -p no:cacheprovider -W error::RuntimeWarning -m "not gpu and not repo_local"

  docs:
    runs-on: ubuntu-latest
    env:
      CC: gcc-13
      CXX: g++-13
      HAWK_CXX: g++-13
      HAWK_NVCC: /usr/local/cuda-12.6/bin/nvcc
      HAWK_NVCC_CCBIN: /usr/bin/g++-13
      # ccache: CMake reads the *_COMPILER_LAUNCHER variables, also under scikit-build-core
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_CUDA_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7
        with:
          path: hawk

      - uses: ./hawk/.github/actions/companion
        with: {repo: aether, path: aether, pins: hawk/.github/companions, token: "${{ secrets.SIBLING_READ_TOKEN || github.token }}"}

      - uses: ./hawk/.github/actions/companion
        with: {repo: eagle, path: eagle, pins: hawk/.github/companions, token: "${{ secrets.SIBLING_READ_TOKEN || github.token }}"}

      - uses: ./hawk/.github/actions/companion
        with: {repo: raptor, path: raptor, pins: hawk/.github/companions, token: "${{ secrets.SIBLING_READ_TOKEN || github.token }}"}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            hawk/pyproject.toml
            aether/dsc/pyproject.toml
            raptor/pyproject.toml
            eagle/python/pyproject.toml
            hawk/docs/requirements.txt

      - run: sudo apt-get update && sudo apt-get install -y g++-13 ccache

      # compiled objects persist across runs; one cache per job and architecture
      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-v2-${{ runner.os }}-${{ runner.arch }}-docs-${{ hashFiles('**/*.h', '**/*.hpp', '**/*.cpp', '**/*.cu', '**/*.cuh', '**/CMakeLists.txt') }}
          restore-keys: |
            ccache-v2-${{ runner.os }}-${{ runner.arch }}-docs-
      - run: ccache -z

      - uses: ./hawk/.github/actions/cuda-toolchain

      - run: |
          cmake -DAETHER_CPP_MODE=OFF -DCMAKE_CUDA_COMPILER="$(which nvcc)" \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/__install" \
            -B aether/build -S aether
          cmake --install aether/build
          cmake -B eagle/__eagle_hdr -S eagle -DCMAKE_CUDA_COMPILER="$(which nvcc)" \
            -DCMAKE_CUDA_ARCHITECTURES=70 \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/__install"
          cmake --install eagle/__eagle_hdr

      - run: |
          python -m pip install --quiet --upgrade pip
          # aether-dsc's payload is sealed at build time (it is not tracked in
          # git): seal it from the sibling checkout, as the release workflow does,
          # in a throwaway venv so the NVRTC packages never reach the test env.
          python -m venv "$RUNNER_TEMP/seal"
          "$RUNNER_TEMP/seal/bin/pip" install --quiet "cuda-bindings" "nvidia-cuda-nvrtc-cu12" "nvidia-cuda-cccl-cu12"
          (cd aether/dsc && "$RUNNER_TEMP/seal/bin/python" -m aether_dsc.seal)
          python -m pip install --quiet ./aether/dsc ./raptor
          export CMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/__install:${CMAKE_PREFIX_PATH}"
          # build deps preinstalled + --no-build-isolation: an isolated build compiles nanobind from a
          # random /tmp build env, so every compile line differs and ccache never hits;
          # --only-binary=:all: still builds this local project but never a dependency from
          # source, so no third-party sdist is ever built without its own isolated env
          python -m pip install --quiet "scikit-build-core>=0.10" "nanobind>=3.1,<4"
          export SKBUILD_CMAKE_ARGS="-DCMAKE_CUDA_COMPILER=$(which nvcc);-DCMAKE_CUDA_ARCHITECTURES=70"
          python -m pip install --quiet --no-build-isolation --only-binary=:all: ./eagle/python

      - env:
          HAWK_AETHER_INCLUDE: ${{ github.workspace }}/aether
          HAWK_EAGLE_INCLUDE: ${{ github.workspace }}/eagle
        run: |
          cd hawk
          python -m pip install --quiet --no-build-isolation --only-binary=:all: -e '.[test]'
          python -m pip install --quiet -r docs/requirements.txt

      # nbcheck also executes every notebook on the CPU, so the notebooks' own dependencies must be present
      - run: python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu

      - name: make nbcheck (every notebook filled, then run on the CPU)
        run: cd hawk/docs && make nbcheck

      - name: make strict
        run: cd hawk/docs && make strict

      - id: tree
        run: echo "tree=$(git -C hawk rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: site-${{ steps.tree.outputs.tree }}
          retention-days: 90
          path: hawk/docs/_build/html
      - if: always()
        run: ccache -s

  # Informational: a non-release PR carries an already published version.
  pypi-version:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ needs.build.outputs.tree }}
          path: dist
      - run: |
          whl=$(ls dist/*.whl | head -n 1 | xargs basename)
          version=$(echo "$whl" | cut -d- -f2)
          if curl -fsS "https://pypi.org/pypi/raptor-hawk/${version}/json" > /dev/null; then
            echo "::notice::raptor-hawk ${version} is already on PyPI; a release needs a version bump"
          else
            echo "::notice::raptor-hawk ${version} is not on PyPI yet"
          fi
