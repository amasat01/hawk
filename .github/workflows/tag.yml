#
# A merge to main whose pull request carries a release label gets the annotated tag vX.Y.Z on the merged commit
# (X.Y.Z from the top heading of CHANGELOG.md, which the label must agree with), then publish.yml is started on that tag. (A tag pushed with GITHUB_TOKEN
# starts no workflow, hence the dispatch.) release:none (docs-only) tags nothing.

name: Tag

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tag the new version and start publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          labels=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].labels[].name' | tr '\n' ' ')
          V=$(python tools/next_version.py)
          if [ -z "$V" ]; then
            grep -qE 'release:(patch|minor|major|rc|[0-9])' <<< "$labels" && { echo "::error::a release label, but CHANGELOG.md is not headed with a new version"; exit 1; }
            echo "no release heading: nothing to tag"; exit 0
          fi
          L=$(python tools/next_version.py "$labels")
          [ "$L" = "$V" ] || { echo "::error::CHANGELOG.md is headed $V, the label gives '${L:-nothing}': not publishing"; exit 1; }
          if [ -n "$(git ls-remote --tags origin "refs/tags/v$V")" ]; then
            echo "::error::tag v$V already exists"
            exit 1
          fi
          # The artifact must carry the version being tagged.
          bash tools/ci_fetch_artifact.sh dist "$(git rev-parse 'HEAD^{tree}')" dist
          built=$(basename dist/*.tar.gz .tar.gz); built=${built##*-}
          [ "$built" = "$V" ] || { echo "::error::the artifact is version $built, the heading gives $V"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$V" -m "v$V" "$GITHUB_SHA"
          git push origin "v$V"
          gh workflow run publish.yml --ref "v$V"
