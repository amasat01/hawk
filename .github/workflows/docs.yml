#
# Builds the Sphinx docs and deploys them to GitHub Pages on push to main.
# Notebooks are executed LOCALLY and committed WITH outputs (docs/Makefile's
# `nbexec`); this job only checks they were (`nbcheck`) and renders them —
# conf.py sets nb_execution_mode = "off", so this job never re-executes one.
#
# Builds the same compiled stack ci.yml does (hawk._core needs aether/eagle
# headers to compile against, and autosummary needs the real package
# importable to introspect) -- see ci.yml for the toolchain notes this
# mirrors.

name: docs

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CC: gcc-13
      CXX: g++-13
      HAWK_CXX: g++-13
      HAWK_NVCC: /usr/local/cuda-12.6/bin/nvcc
      HAWK_NVCC_CCBIN: /usr/bin/g++-13
      # ccache: CMake reads the *_COMPILER_LAUNCHER variables, also under scikit-build-core
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_CUDA_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7
        with:
          path: hawk

      - uses: actions/checkout@v7
        with:
          repository: amasat01/aether
          path: aether
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}

      - uses: actions/checkout@v7
        with:
          repository: amasat01/eagle
          path: eagle
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}

      - uses: actions/checkout@v7
        with:
          repository: amasat01/raptor
          path: raptor
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            hawk/pyproject.toml
            aether/dsc/pyproject.toml
            raptor/pyproject.toml
            eagle/python/pyproject.toml
            hawk/docs/requirements.txt

      - run: sudo apt-get update && sudo apt-get install -y g++-13 ccache

      # compiled objects persist across runs; one cache per job and architecture
      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-docs-${{ hashFiles('**/*.h', '**/*.hpp', '**/*.cpp', '**/*.cu', '**/*.cuh', '**/CMakeLists.txt') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-docs-
      - run: ccache -z

      - name: Install compile-only CUDA 12.6 toolchain (nvcc; no driver/GPU)
        run: |
          curl -fsSL -o /tmp/cuda-keyring.deb \
            https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i /tmp/cuda-keyring.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cuda-nvcc-12-6 cuda-cudart-dev-12-6 cuda-driver-dev-12-6
          echo "/usr/local/cuda-12.6/bin" >> "$GITHUB_PATH"
          echo "CUDA_HOME=/usr/local/cuda-12.6" >> "$GITHUB_ENV"

      - run: |
          cmake -DAETHER_CPP_MODE=OFF -DCMAKE_CUDA_COMPILER="$(which nvcc)" \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/__install" \
            -B aether/build -S aether
          cmake --install aether/build
          cmake -B eagle/__eagle_hdr -S eagle -DCMAKE_CUDA_COMPILER="$(which nvcc)" \
            -DCMAKE_CUDA_ARCHITECTURES=70 \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/__install"
          cmake --install eagle/__eagle_hdr

      - run: |
          python -m pip install --quiet --upgrade pip
          # aether-dsc's payload is sealed at build time (it is not tracked in
          # git): seal it from the sibling checkout, as the release workflow does,
          # in a throwaway venv so the NVRTC packages never reach the test env.
          python -m venv "$RUNNER_TEMP/seal"
          "$RUNNER_TEMP/seal/bin/pip" install --quiet "cuda-bindings" "nvidia-cuda-nvrtc-cu12" "nvidia-cuda-cccl-cu12"
          (cd aether/dsc && "$RUNNER_TEMP/seal/bin/python" -m aether_dsc.seal)
          python -m pip install --quiet ./aether/dsc ./raptor
          export CMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/__install:${CMAKE_PREFIX_PATH}"
          # build deps preinstalled + --no-build-isolation: an isolated build compiles nanobind from a
          # random /tmp build env, so every compile line differs and ccache never hits;
          # --only-binary=:all: still builds this local project but never a dependency from
          # source, so no third-party sdist is ever built without its own isolated env
          python -m pip install --quiet "scikit-build-core>=0.10" "nanobind>=3.1,<4"
          export SKBUILD_CMAKE_ARGS="-DCMAKE_CUDA_COMPILER=$(which nvcc);-DCMAKE_CUDA_ARCHITECTURES=70"
          python -m pip install --quiet --no-build-isolation --only-binary=:all: ./eagle/python

      - env:
          HAWK_AETHER_INCLUDE: ${{ github.workspace }}/aether
          HAWK_EAGLE_INCLUDE: ${{ github.workspace }}/eagle
        run: |
          cd hawk
          python -m pip install --quiet --no-build-isolation --only-binary=:all: -e '.[test]'
          python -m pip install --quiet -r docs/requirements.txt

      - name: make nbcheck
        run: cd hawk/docs && make nbcheck

      - name: make strict
        run: cd hawk/docs && make strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: hawk/docs/_build/html
          retention-days: 7
      - if: always()
        run: ccache -s

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
