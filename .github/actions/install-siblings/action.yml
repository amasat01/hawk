name: Install siblings
description: For each sibling package, pin its checkout's version if that version is on PyPI, else build it from the checkout. Install with `pip install --find-links "$dir" $pins`.
inputs:
  siblings:
    description: Whitespace-separated `pkg=path` pairs, path being the package directory inside the sibling's companion checkout (e.g. `raptor-core=raptor aether-dsc=aether/dsc`).
    required: true
  dir:
    description: Output directory for what gets built.
    required: false
    default: sibling-dist
  dry:
    description: Set to `dry` to resolve pins and `built` without building anything.
    required: false
    default: ""
outputs:
  built:
    description: Packages built from their checkout (not on PyPI), space-separated.
    value: ${{ steps.run.outputs.built }}
  dir:
    description: Find-links directory (empty when everything is released).
    value: ${{ steps.run.outputs.dir }}
  pins:
    description: Exact pins, `pkg==V ...`.
    value: ${{ steps.run.outputs.pins }}
runs:
  using: composite
  steps:
    # A restored OUT makes the script print `cached` for what it finds there. The key covers each sibling's tracked tree
    # and version, the script, the Python (version, ABI, platform), SIBLING_SDISTS and the eagle plugin headers the seal finds beside the aether checkout.
    - id: key
      if: inputs.dry == ''
      shell: bash
      env:
        SIBLINGS: ${{ inputs.siblings }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        args=(--file "$ACTION_PATH/install_siblings.sh")
        args+=(--str "$(python -c 'import sys, sysconfig; print(sys.version, sysconfig.get_platform())')" --str "sdists:${SIBLING_SDISTS:-}" --str "$SIBLINGS")
        for pair in $SIBLINGS; do
          root=$(cd "${pair#*=}" && pwd)
          until [ -e "$root/.git" ]; do root=$(dirname "$root"); done
          args+=(--tree "$root" --version "$root")
          for h in "$(dirname "$root")"/*/plugin/gref_layout.h "$(dirname "$root")"/*/plugin/gref_abi.h; do [ ! -e "$h" ] || args+=(--file "$h"); done
        done
        digest=$("$ACTION_PATH/../../ci_digest.sh" "${args[@]}") || exit 1
        [ -n "$digest" ] || { echo "::error::empty digest"; exit 1; }
        echo "key=siblings-v2-$RUNNER_OS-$RUNNER_ARCH-$digest" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v6
      if: inputs.dry == ''
      with:
        path: ${{ inputs.dir }}
        key: ${{ steps.key.outputs.key }}
    - id: run
      shell: bash
      env:
        SIBLINGS: ${{ inputs.siblings }}
        OUT: ${{ inputs.dir }}
        DRY: ${{ inputs.dry }}
      run: bash "${{ github.action_path }}/install_siblings.sh" "$SIBLINGS" "$OUT" "$DRY"
