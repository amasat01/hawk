name: Compile-only CUDA toolchain
description: CUDA 12.6 nvcc and headers from NVIDIA's apt repo (Ubuntu 24.04, x86_64); no driver, no GPU.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        curl -fsSL -o /tmp/cuda-keyring.deb \
          https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
        sudo dpkg -i /tmp/cuda-keyring.deb
        sudo apt-get update
        # cuda-nvcc-12-6: nvcc/ptxas/cicc. cuda-cudart-dev-12-6: cuda_runtime.h
        # + libcudart (nvcc auto-includes cuda_runtime.h even for -c-only
        # compiles). cuda-driver-dev-12-6: the libcuda.so DRIVER STUB (under
        # lib64/stubs, no actual driver), because eagle's python/CMakeLists.txt
        # links CUDA::cuda_driver.
        sudo apt-get install -y --no-install-recommends \
          cuda-nvcc-12-6 cuda-cudart-dev-12-6 cuda-driver-dev-12-6
        echo "/usr/local/cuda-12.6/bin" >> "$GITHUB_PATH"
        echo "CUDA_HOME=/usr/local/cuda-12.6" >> "$GITHUB_ENV"
