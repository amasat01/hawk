name: Tag the checkout with its version
description: On a pull request, tag this checkout (fetch-depth 0) with the version CHANGELOG.md's top heading gives, so every build reads it from git.
inputs:
  path:
    description: The checkout directory.
    default: "."
runs:
  using: composite
  steps:
    - if: github.event_name == 'pull_request'
      shell: bash
      working-directory: ${{ inputs.path }}
      run: |
        v=$(python3 tools/next_version.py 2>/dev/null || true)  # `## Unreleased` heading: build untagged
        [ -z "$v" ] || git tag "v$v"
