# The lowering component: the neutral lowering of a kernel (thread box, team stages, placement, ordered logs), a package root of its own. It imports the standard library and raptor
# only; a front end finds it as an installed distribution (the ``raptor.components`` entry point below) and reads its manifest.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "raptor-lowering"
version = "0.0.0"
description = "The lowering component of the raptor family: thread-box, team-stage, placement and ordered-log lowering"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = ["raptor-core"]

[project.entry-points."raptor.components"]
lowering = "lowering"

[tool.setuptools]
packages = ["lowering"]

[tool.setuptools.package-data]
lowering = ["component.json"]
