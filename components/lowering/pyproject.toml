# The base wing of raptor (its package is lowering until its rename): the neutral lowering of a kernel (thread box, team stages, placement, ordered logs), a package root of its own. It imports the standard library and raptor
# only; a front end finds it as an installed distribution (the ``raptor.wings`` entry point below) and reads its manifest.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "raptor-base"
version = "0.0.0"
description = "The base wing of the raptor family: thread-box, team-stage, placement and ordered-log lowering"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = ["raptor-core"]

[project.entry-points."raptor.wings"]
base = "lowering"

[tool.setuptools]
packages = ["lowering"]

[tool.setuptools.package-data]
lowering = ["wing.json"]
