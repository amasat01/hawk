# Settings for the shared docs tools (python -m raptor_docs.nb / .fresh); see the raptor-docs package.
repo = "hawk"
helper_dirs = ["docs/content/_shared", "examples"]
image_budget = 500_000
nb_roots = ["docs/content"]
fresh = [
  "python tools/sync_perf_claims.py",
  "python -m raptor_docs.capmap -o docs/_static/capmap.svg",
  "python -m raptor_docs.themed_figure --sync docs/content/_shared/themed_figure.py",
]

[helper_needs]
"docs/content/_shared/nb_helpers.py" = ["matplotlib"]
"examples/autodiff_vs_torch.py" = ["torch"]
"examples/two_body_hybrid.py" = ["torch"]
