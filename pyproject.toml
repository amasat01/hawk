# HAWK grows a compiled half (`hawk._core`), so the backend
# is scikit-build-core + nanobind — the SAME packaging eagle's binding uses
# (`eagle/python/{pyproject.toml,CMakeLists.txt}`), deliberately, so the two
# compiled halves of this family are built and installed one way and not two.
[build-system]
requires = [
    "scikit-build-core>=0.10",
    "setuptools-scm>=8",
    # nanobind 3 needs Python 3.10+; 3.9 (no free-threaded build) uses nanobind 2
    "nanobind>=3.1,<4; python_version>='3.10'",
    "nanobind>=2.2,<3; python_version<'3.10'",
]
build-backend = "_build_backend"
backend-path = ["."]

[project]
# DIST name carries the family namespace (mirrors the sibling packages'
# "raptor-core" convention); the IMPORT name stays flat
# (`import hawk`).
name = "raptor-hawk"
dynamic = ["version"]
description = "HAWK — Hardware Agnostic Writing of Kernels: a Python DSL that writes GPU/CPU kernels and deploys them through eagle"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
# Python versions match the cibuildwheel matrix release.yml actually builds
# and the test-wheel job actually runs (cp39-cp315 plus free-threaded cp313t/cp314t/cp315t; manylinux_2_28 x86_64 and aarch64, macOS arm64) —
# never wider than what a real wheel ships. GPU/CUDA: hawk's own compiled
# core is host-only (see wheel.packages below), but its purpose is writing
# and deploying GPU kernels through eagle, the reason this classifier exists.
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Environment :: GPU :: NVIDIA CUDA",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
]
# Runtime dependencies beyond the binding itself: `raptor-core` (`raptor.flow`, which the
# frontend imports) and `aether-dsc`: the sealed
# AETHER payload every NVRTC device compile serves headers from
# (`hawk.compile.payload.current_payload()`), added the day the code that
# uses it landed rather than pre-declared ahead of it.
# raptor-core, aether-dsc, raptor-hawk and raptor-eagle share one version from 0.7.0; aether-dsc
# 0.7.2 brings the team linear-algebra headers, keyed block sums and the QR solve hawk emits.
# numpy: hawk never imports it, but the host route and every example pass NumPy arrays
dependencies = ["aether-dsc>=0.7.2,<0.8", "raptor-core>=0.7.0,<0.8", "numpy>=1.26"]

[project.optional-dependencies]
# numpy is a TEST dependency only: the finite-difference row evaluates a
# primal and its derivative IR with the scratch interpreter in tests/_eval.py.
test = ["pytest", "numpy", "scipy", "raptor-core>=0.7.0,<0.8"]
# The GPU route: NVRTC + CCCL + cuda-bindings for one CUDA major (no nvcc needed).
# CUDA 13's wheels carry no -cu13 suffix (those names on PyPI are empty placeholders).
cuda12 = ["cuda-bindings>=12.6,<13", "nvidia-cuda-nvrtc-cu12>=12.6,<13", "nvidia-cuda-cccl-cu12>=12.6,<13"]
cuda13 = ["cuda-bindings>=13,<14", "nvidia-cuda-nvrtc>=13,<14", "nvidia-cuda-cccl>=13,<14"]

# The compiled `hawk._core` is a nanobind extension, so a wheel is per-Python/ABI
# (never py3-none-any). It is HOST-ONLY — no device kernels, no arch list, no nvcc
# (eagle launches the device artifact, HAWK never does) — so one plain
# CMake build per Python version is the whole story.
[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.packages = ["hawk"]
cmake.version = ">=3.20"
# Keep a dev build's in-tree extension out of the pure-python source collection;
# the wheel's copy comes from the CMake install.
sdist.exclude = ["**/*.so"]
# The header copy _build_backend.py makes; git-ignored, so listed.
sdist.include = ["_sdist_include/**"]
# LICENSE/NOTICE sit right next to this pyproject.toml (unlike eagle's, whose
# Python packaging lives one directory below its repo root) -- scikit-build-core's
# own glob (not PEP 639's project.license-files, which would force `license`
# off the classic dict form the Apache classifier above still needs) copies
# them into the wheel's dist-info/licenses/.
wheel.license-files = ["LICENSE", "NOTICE"]

# The version is the latest vX.Y.Z git tag (a PR build tags its checkout first); sdists carry it
# in PKG-INFO. The wheel also carries it as hawk/_version.py, which hawk/__init__.py reads:
# importing hawk to learn its version would run the self-check against a `_core` this very
# build is producing, and importlib.metadata at import costs more than a module.
[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]   # setuptools-scm < 9 refuses a project without this section

[[tool.scikit-build.generate]]
path = "hawk/_version.py"
template = 'version = "${version}"'

[tool.pytest.ini_options]
testpaths = ["tests"]
# Makes `import hawk` work against the checked-out tree without an install --
# this repo root, prepended to sys.path before collection (mirrors raptor
# and the family's own pyproject convention).
pythonpath = ["."]
markers = [
    "gpu: needs a CUDA GPU and cupy; CI on a GPU-less runner deselects it with -m \"not gpu\"",
    "ft: free-threading rows (need a free-threaded interpreter; skip on a GIL build)",
    "repo_local: reads the repository's source tree, which a wheel install does not carry; only the wheel test (release.yml) deselects it",
    "wall_clock: compares measured run times, which flip with machine load; skipped unless HAWK_WALL_CLOCK_ROWS=1 is set (run on a quiet machine)",
]

[tool.ruff]
target-version = "py39"
# notebooks are executed by nbcheck, not linted
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["F"]
# kernel bodies assign named values the tracer reads; deleting them changes the kernel
ignore = ["F841"]

[tool.ruff.lint.per-file-ignores]
# A named-axis plane declares its layout with Python's slice syntax inside an
# annotation (`Grid["row", "col":8]`); ruff reads each axis label as an
# undefined name. Scoped to the modules that author such kernels, so an
# undefined name anywhere else still fails.
"examples/two_body_hybrid.py" = ["F821"]
"tests/_autodiff_kernels.py" = ["F821"]
"tests/_kan.py" = ["F821"]
"tests/_block_kernels.py" = ["F821"]
"tests/_net_axis_kernels.py" = ["F821"]
"tests/test_across_lanes.py" = ["F821"]
"tests/test_broadcast_bind.py" = ["F821"]
"tests/test_broadcast_deploy.py" = ["F821"]
"tests/test_broadcast_matrix.py" = ["F821"]
"tests/test_diff_loop_dispatch_gather.py" = ["F821"]
"tests/test_index_set.py" = ["F821"]
"tests/test_ir_loops_hoisting.py" = ["F821"]
"tests/test_diff_nested_loops.py" = ["F821"]
"tests/test_diff_second_order_loops.py" = ["F821"]
"tests/test_emit_rolled.py" = ["F821"]
"tests/test_grid_bind.py" = ["F821"]
"tests/test_grid_declaration.py" = ["F821"]
"tests/test_ir_contraction.py" = ["F821"]
"tests/test_ir_index_form.py" = ["F821"]
"tests/test_ir_loop_digest_memory.py" = ["F821"]
"tests/test_kernel_call.py" = ["F821"]
"tests/test_linalg_frontend.py" = ["F821"]
"tests/test_loop_lowering_card.py" = ["F821"]
"tests/test_named_axis_mutable.py" = ["F821"]
"tests/test_pair_index.py" = ["F821"]
"tests/test_reduce_samples.py" = ["F821"]
"tests/test_refusal_pins.py" = ["F821"]
"tests/test_runtime_first_axis.py" = ["F821"]
"tests/test_sidecar_schema.py" = ["F821"]
"tests/test_sorted_index.py" = ["F821"]
"tests/test_sum_readback.py" = ["F821"]
"tests/test_table_positional.py" = ["F821"]
"tests/test_trace_loop_lowering.py" = ["F821"]
