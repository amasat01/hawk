[package]
name = "osprey_cuda"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"
# the build script hands the toolkit root to the door package beside it (DEP_OSPREY_CUDA_DEVICE_ROOT); nothing is linked by this name
links = "osprey_cuda_device"

[lib]
# the loadable object is made by the door package beside it, so that no other crate links the exported symbol
name = "osprey_cuda_lib"
crate-type = ["rlib"]

[dependencies]
osprey_lowering = { path = "../components/lowering" }
toolkit = { path = "../components/toolkit" }
raptor_ir = { path = "../../raptor/rs/ir" }
raptor_wings = { path = "../../raptor/rs/wings" }
aether_writers = { path = "../../aether/rs/writers" }
rcore = { path = "../../raptor/rs/core" }

[build-dependencies]
toolkit = { path = "../components/toolkit" }
rcore = { path = "../../raptor/rs/core" }
